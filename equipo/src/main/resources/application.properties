spring.application.name=equipo
#Habilitar la consola web de H2
spring.h2.console.enable=true
# URL fija para que no cambie en cada reinicio
spring.datasource.url=jdbc:h2:mem:testdb
# Mostrar las sentencias SQL que Spring genera por debajo
spring.jpa.show-sql=true
# Indicar a Hibernate que cree las tablas y luego ejecute el import.sql
spring.jpa.hibernate.ddl-auto=create-drop
# Mostrar el SQL formateado en la consola de Eclipse para que vean los INSERT
spring.jpa.properties.hibernate.format_sql=true
server.port = 3000